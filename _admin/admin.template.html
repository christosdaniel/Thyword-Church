<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{APP_HEAD}}
<meta name="robots" content="noindex, nofollow">
<title>Website Admin | Thyword International Worship Centre</title>
<link rel="icon" type="image/png" href="{{LOGO}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
{{SITE_CSS}}
</style>
<style>
  body { background: var(--bg-soft); }
  .adm-top { background: var(--green-900); color: #fff; position: sticky; top: 0; z-index: 40; }
  .adm-top .container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 68px; flex-wrap: wrap; padding: .5rem 0; }
  .adm-top .brand-name { color: #fff; }
  .adm-top .brand img { width: 46px; height: 46px; }
  .adm-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .conn { font-size: .8rem; padding: .3rem .7rem; border-radius: 999px; background: rgba(255,255,255,.12); }
  .conn.ok { background: var(--mint); color: var(--green-900); font-weight: 700; }
  .adm-wrap { display: grid; grid-template-columns: 230px 1fr; gap: 1.5rem; padding: 1.5rem 0 4rem; }
  @media (max-width: 860px) { .adm-wrap { grid-template-columns: 1fr; } }
  .adm-tabs { display: flex; flex-direction: column; gap: .3rem; position: sticky; top: 90px; align-self: start; }
  @media (max-width: 860px) { .adm-tabs { flex-direction: row; overflow-x: auto; position: static; padding-bottom: .3rem; } }
  .adm-tabs button { text-align: left; border: 0; background: #fff; padding: .75rem 1rem; border-radius: 10px; font-family: var(--font-head); font-weight: 600; color: var(--green-800); cursor: pointer; white-space: nowrap; }
  .adm-tabs button.active { background: var(--green-700); color: #fff; }
  .panel { background: #fff; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(7,46,45,.06); padding: 1.6rem; margin-bottom: 1.2rem; }
  .panel h2 { font-size: 1.35rem; }
  .panel > p.help, .help { color: var(--muted); font-size: .88rem; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1rem; }
  .fields .full { grid-column: 1 / -1; }
  @media (max-width: 640px) { .fields { grid-template-columns: 1fr; } }
  .item { border: 1.5px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; background: #fcfdfc; }
  .item-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .8rem; }
  .item-head strong { font-family: var(--font-head); color: var(--green-800); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-tools { display: flex; gap: .3rem; flex: 0 0 auto; }
  .icon-btn { border: 1.5px solid var(--line); background: #fff; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: .95rem; color: var(--green-800); }
  .icon-btn:hover { border-color: var(--green-600); }
  .icon-btn.del:hover { background: var(--red-600); color: #fff; border-color: var(--red-600); }
  .media-field { display: flex; gap: .5rem; align-items: center; }
  .media-field input[type=text] { flex: 1; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--bg-soft); flex: 0 0 64px; }
  .switch { display: flex; align-items: center; gap: .8rem; padding: 1rem; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; font-weight: 700; }
  .switch input { width: 22px; height: 22px; accent-color: var(--red-600); }
  .switch.on { border-color: var(--red-600); background: #fff1f1; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--green-900); color: #fff; padding: .9rem 1.4rem; border-radius: 12px; box-shadow: var(--shadow); z-index: 200; max-width: calc(100% - 32px); display: none; }
  .toast.show { display: block; }
  .toast.err { background: var(--red-600); }
  .steps { padding-left: 1.2rem; font-size: .9rem; }
  .steps li { margin-bottom: .4rem; }
  .dropzone { border: 2px dashed var(--mint); background: var(--mint-100); border-radius: 12px; padding: 1.4rem; text-align: center; margin-bottom: 1rem; }
  .progress { font-size: .85rem; color: var(--green-700); font-weight: 600; margin-top: .5rem; min-height: 1.2em; }
  .unsaved { background: var(--gold); color: var(--green-900); font-weight: 800; font-size: .75rem; padding: .25rem .6rem; border-radius: 999px; }
  /* iPhone app: room for the notch / status bar, compact top bar */
  .adm-top { padding-top: env(safe-area-inset-top); }
  #gate { padding-top: calc(16px + env(safe-area-inset-top)) !important; }
  .adm-wrap { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
  @media (max-width: 640px) {
    #downloadBtn, .adm-top .brand-tag { display: none; }
    .adm-top .brand-name { font-size: .85rem; }
    .adm-top .container { gap: .5rem; }
    .adm-actions { width: 100%; justify-content: space-between; }
    .conn { font-size: .72rem; }
  }
  .sub-heading { font-family: var(--font-head); font-weight: 800; color: var(--red-600); text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; border-top: 1px solid var(--line); padding-top: .9rem; margin-top: .3rem; }
  .sub-list { display: flex; flex-direction: column; gap: .6rem; }
  .sub-item { position: relative; border: 1px dashed var(--line); border-radius: 10px; padding: .8rem 3rem .8rem .8rem; background: #fff; }
  .sub-del { position: absolute; top: .6rem; right: .6rem; }
  .sub-list > .btn { align-self: flex-start; }
  code { background: var(--bg-soft); padding: .1rem .35rem; border-radius: 5px; font-size: .85em; }
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:300;background:linear-gradient(120deg,var(--green-900),var(--green-700) 60%,var(--red-700));display:flex;align-items:center;justify-content:center;padding:16px">
  <form id="gateForm" style="background:#fff;border-radius:18px;padding:2rem;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow)">
    <img src="{{LOGO}}" alt="Logo" style="width:90px;margin:0 auto 1rem">
    <h2 style="font-size:1.3rem">Admin Login</h2>
    <p class="help" style="color:var(--muted);font-size:.9rem">This area is for church administrators only.</p>
    <div style="display:flex;gap:.4rem;margin-bottom:.8rem"><input type="password" id="gatePass" placeholder="Admin password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus><button type="button" id="gateShow" class="btn btn-outline-dark btn-sm" style="flex:0 0 auto">Show</button></div>
    <label style="display:flex;align-items:center;gap:.5rem;justify-content:center;font-weight:600;font-size:.88rem;margin:0 0 .8rem;color:var(--green-800)"><input type="checkbox" id="gateRemember" checked style="width:18px;height:18px;accent-color:var(--green-700)"> Keep me logged in on this device</label>
    <button class="btn btn-red" type="submit" style="width:100%">Log in</button>
    <p id="gateMsg" style="color:var(--red-600);font-weight:600;min-height:1.4em;margin:.8rem 0 0;font-size:.9rem"></p>
    
  </form>
</div>
<div class="adm-top">
  <div class="container">
    <a class="brand" href="#"><img src="{{LOGO}}" alt="Logo"><span class="brand-text"><span class="brand-name">Website Admin</span><span class="brand-tag" style="color:var(--gold)">Thyword International Worship Centre</span></span></a>
    <div class="adm-actions">
      <span class="unsaved hidden" id="unsaved">Unsaved changes</span>
      <span class="conn" id="connState">Not connected</span>
      <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Log out</button>
      <button class="btn btn-outline btn-sm" id="downloadBtn" type="button">Download file</button>
      <button class="btn btn-gold btn-sm" id="publishBtn" type="button">Save &amp; Publish</button>
    </div>
  </div>
</div>

<div class="container adm-wrap">
  <nav class="adm-tabs" id="tabs"></nav>
  <div id="panels"></div>
</div>

<div class="toast" id="toast"></div>
<script>
{{ADMIN_JS}}
</script>
{{APP_SCRIPT}}
</body>
</html>
