<script>
  // Remove the old app's saved copy, then go to the new admin address
  (function () {
    var go = function () { location.replace("../tiwc-admin-p7q3x/"); };
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); })); } catch (e) {}
    Promise.all(jobs).then(go, go); setTimeout(go, 1500);
  })();
</script></head>
<body><div><h1>The admin has moved</h1><p>Taking you to the new admin&hellip;</p><p><a href="../tiwc-admin-p7q3x/">Open the new admin</a></p>
