name: Update YouTube sermons

# Collects the latest videos from the church YouTube channel into
# data/youtube.js, so they appear on the website's Watch Sermons page.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    paths:
      - ".github/workflows/youtube-videos.yml"
      - "scripts/fetch_youtube.py"
      - "data/content.js"

permissions:
  contents: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch videos from YouTube
        run: python3 scripts/fetch_youtube.py

      - name: Save changes
        run: |
          if git diff --quiet -- data/youtube.js; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.js
          git commit -m "Update YouTube sermons"
          git pull --rebase
          git push
